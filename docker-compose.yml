version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: shap_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shap_platform
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shap_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/shap_platform
      - JWT_SECRET=shap_super_secret_jwt_key_2025_access_health
      - CLIENT_URL=http://localhost:5173
      - RESERVATION_EXPIRY_MINUTES=15
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shap_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:

